name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Not ubuntu-latest for now: its kernel (7.0.0 in image 20261018) is one MongoDB 8 refuses to
    # start on, from 6.19 up to 7.0.13 (https://jira.mongodb.org/browse/SERVER-125742). Go back
    # once the 24.04 image ships kernel 7.0.14 or later.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The supported Java range; see the Compatibility Matrix in the README. The tests start
        # MongoDB with Testcontainers, which uses the Docker daemon the runner comes with.
        java: [17, 21, 25]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
